name: Lighthouse CI
on: [push]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 10 — the project's toolchain since Phase 10 (the
          # settings-only pnpm-workspace.yaml with onlyBuiltDependencies
          # is invalid under pnpm 9, which is what broke every CI run
          # from 2026-09-21 onward with "packages field missing").
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: '.lighthouserc.json'
          runs: 3
